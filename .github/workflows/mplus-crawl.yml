name: Mythic+ Crawl (Weekly)

# Runs every Monday at 14:30 UTC — alongside PvP crawl, staggered 30 min.
# Fetches all dungeon leaderboards and extracts spec_id directly from the
# response — no character profile calls. Writes mplus_latest.json to Vercel Blob.
# Typical runtime: ~5 minutes.

on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run M+ crawl → Vercel Blob
        env:
          BLIZZARD_CLIENT_ID:     ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLOB_READ_WRITE_TOKEN:  ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python -m scripts.run_crawl --phase mplus --region us
