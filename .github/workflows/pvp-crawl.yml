name: PvP Crawl (Weekly)

# Runs every Monday at 14:00 UTC — before NA patch day (Tuesday ~15:00 UTC).
# Fetches all 85 bracket leaderboards, deduplicates ~80k characters,
# fetches a profile for each, and writes pvp_latest.json to Vercel Blob.
# Typical runtime: ~30 minutes.

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PvP crawl → Vercel Blob
        env:
          BLIZZARD_CLIENT_ID:     ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLOB_READ_WRITE_TOKEN:  ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python -m scripts.run_crawl --phase pvp --region us
