name: General Population Crawl (Daily)

# Runs a daily incremental batch of the general population census.
# Each run:
#   1. Seeds new guilds from PvP/M+ character data (mode=all)
#   2. Crawls 500 guild rosters → discovers characters
#   3. Profiles up to 5k census characters missing active_spec_id
#   4. Re-aggregates general + RP demographics snapshots
#   5. Exports blob to Vercel CDN
#
# Typical runtime: ~20-40 min for 500 guilds + spec resolution.

on:
  schedule:
    - cron: '0 8 * * *'   # Daily at 08:00 UTC (off-peak for Blizzard API)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Census mode'
        required: false
        default: 'all'
        type: choice
        options: [seed, roster, all]
      batch_size:
        description: 'Guild batch size'
        required: false
        default: '500'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run census batch → aggregate → export blob
        env:
          BLIZZARD_CLIENT_ID:     ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          BLOB_READ_WRITE_TOKEN:  ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          python -m scripts.run_crawl \
            --phase census \
            --region us \
            --mode ${{ github.event.inputs.mode || 'all' }} \
            --batch-size ${{ github.event.inputs.batch_size || '500' }}
